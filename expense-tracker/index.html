<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="container">
    <!-- App Header -->
    <header class="app-header">
      <h1><i class="fa-solid fa-wallet"></i> Personal Expense Tracker</h1>
      <p>Track your budget & daily expenses effortlessly</p>
    </header>

    <!-- Notification Toast Message -->
    <div id="notification" class="notification hidden"></div>

    <!-- Financial Summary Cards -->
    <section class="summary-cards">
      <div class="card balance-card">
        <h3>Current Balance</h3>
        <p id="total-balance">₹0.00</p>
      </div>
      <div class="card income-card">
        <h3>Total Income</h3>
        <p id="total-income">₹0.00</p>
      </div>
      <div class="card expense-card">
        <h3>Total Expenses</h3>
        <p id="total-expense">₹0.00</p>
      </div>
    </section>

    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- Transaction Form Card -->
      <section class="card form-section">
        <h2 id="form-title"><i class="fa-solid fa-plus-circle"></i> Add Transaction</h2>
        <form id="transaction-form">
          <input type="hidden" id="transaction-id">

          <div class="form-group">
            <label for="type">Transaction Type</label>
            <select id="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g. Grocery shopping" required>
          </div>

          <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Salary">Salary</option>
              <option value="Freelance">Freelance</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>

          <div class="form-buttons">
            <button type="submit" id="submit-btn" class="btn btn-primary">Add Transaction</button>
            <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
          </div>
        </form>
      </section>

      <!-- Analytics and Transaction History Card -->
      <section class="card history-section">
        
        <!-- Expense Breakdown Progress Bars -->
        <div class="category-breakdown">
          <h2><i class="fa-solid fa-chart-pie"></i> Expense Breakdown</h2>
          <div id="category-progress-container" class="progress-container">
            <!-- Progress bars injected dynamically via JS -->
          </div>
        </div>

        <hr class="divider">

        <!-- History Header & Filter -->
        <div class="history-header">
          <h2><i class="fa-solid fa-list-check"></i> Recent Transactions</h2>
          <div class="filter-group">
            <label for="filter-category"><i class="fa-solid fa-filter"></i> Filter:</label>
            <select id="filter-category">
              <option value="All">All Categories</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Salary">Salary</option>
              <option value="Freelance">Freelance</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <!-- Transactions Table -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="transaction-list">
              <!-- Dynamically populated via JS -->
            </tbody>
          </table>
          <p id="empty-state" class="empty-state">No transactions recorded yet.</p>
        </div>

      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
